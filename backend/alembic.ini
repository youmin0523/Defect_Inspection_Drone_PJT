# =============================================
# alembic.ini
# 역할: Alembic DB 마이그레이션 도구 설정 파일
# 사용법:
#   alembic revision --autogenerate -m "init"  → 마이그레이션 파일 생성
#   alembic upgrade head                        → 최신 스키마 적용
#   alembic downgrade -1                        → 한 단계 롤백
# =============================================

[alembic]
script_location = alembic

# 실제 URL은 alembic/env.py에서 settings.DATABASE_URL로 override됨
# 아래 값은 placeholder이며 런타임에 사용되지 않음
sqlalchemy.url = placeholder://overridden-by-env-py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
